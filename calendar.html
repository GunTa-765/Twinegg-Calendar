<!DOCTYPE html><html lang="ja"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Twinegg カレンダー</title>    <link rel="stylesheet" href="style.css"></head><body>    <div class="container">        <!-- カレンダーメインエリア -->        <div class="calendar-box">            <div class="header">                <!-- PC用：年月と同じラインの左端に「＋ 予定を追加」を配置 -->                <div class="header-left">                    <button id="openModalBtn" class="btn btn-primary-add">＋ 予定を追加</button>                </div>                <!-- 中央：月移動と年月タイトル -->                <div class="header-center">                    <button class="btn nav-btn" onclick="changeMonth(-1)">◀</button>                    <h2 id="calendar-title" class="calendar-title" onclick="toggleYearMonthPicker()" style="cursor:pointer;" title="クリックして年月を選択"></h2>                    <button class="btn nav-btn" onclick="changeMonth(1)">▶</button>                </div>                <!-- 右端：今日ボタン・設定（⚙）ボタン（PC・スマホ共通） -->                <div class="header-right">                    <button class="btn btn-today" onclick="goToday()">今日</button>                    <button class="btn btn-settings-toggle" onclick="toggleSettingsModal()" title="カレンダー設定">⚙</button>                </div>            </div>            <!-- 年月ジャンプピッカー -->            <div id="ym-picker" class="ym-picker-box" style="display:none;">                <div class="ym-picker-header">                    <button class="btn" onclick="changePickerYear(-1)">◀</button>                    <span id="picker-year-title" class="picker-year-text">2026年</span>                    <button class="btn" onclick="changePickerYear(1)">▶</button>                </div>                <div class="ym-picker-months">                    <button class="month-btn" onclick="selectPickerMonth(1)">1月</button>                    <button class="month-btn" onclick="selectPickerMonth(2)">2月</button>                    <button class="month-btn" onclick="selectPickerMonth(3)">3月</button>                    <button class="month-btn" onclick="selectPickerMonth(4)">4月</button>                    <button class="month-btn" onclick="selectPickerMonth(5)">5月</button>                    <button class="month-btn" onclick="selectPickerMonth(6)">6月</button>                    <button class="month-btn" onclick="selectPickerMonth(7)">7月</button>                    <button class="month-btn" onclick="selectPickerMonth(8)">8月</button>                    <button class="month-btn" onclick="selectPickerMonth(9)">9月</button>                    <button class="month-btn" onclick="selectPickerMonth(10)">10月</button>                    <button class="month-btn" onclick="selectPickerMonth(11)">11月</button>                    <button class="month-btn" onclick="selectPickerMonth(12)">12月</button>                </div>                <div class="ym-picker-footer">                    <button class="btn" onclick="toggleYearMonthPicker()">キャンセル</button>                </div>            </div>            <!-- 曜日ヘッダー -->            <div class="days-grid">                <div class="text-sun">日</div>                <div>月</div>                <div>火</div>                <div>水</div>                <div>木</div>                <div>金</div>                <div class="text-sat">土</div>            </div>            <!-- 日付セルグリッド -->            <div id="calendar-days" class="weeks-grid"></div>        </div>        <!-- 予定一覧エリア（PC：右サイドバー / スマホ：日付タップ時全画面） -->        <div class="side-box">            <div class="side-content-top">                <h3 id="side-title" class="side-title"></h3>                <div id="plan-list"></div>            </div>        </div>    </div>    <!-- スマホ右下フローティング追加ボタン -->    <button id="mobile-fab" class="mobile-fab" title="新しい予定を追加">＋</button>    <!-- カレンダー設定モーダル（PC・スマホ共通 全画面化） -->    <div id="settings-modal" class="fullscreen-modal" style="display:none;">        <div class="fullscreen-modal-inner">            <div class="modal-header">                <h3 class="modal-title">カレンダー設定</h3>                <button type="button" class="close-btn" onclick="toggleSettingsModal()">×</button>            </div>            <div class="settings-body">                <p class="settings-desc">予定データをCSVファイル形式でバックアップ（エクスポート）したり、他のカレンダーから読み込む（インポート）ことができます。</p>                <div class="settings-actions">                    <button type="button" class="btn-export settings-btn" onclick="exportToCSV()">CSVでエクスポート</button>                    <label class="btn-import settings-btn">                        CSVからインポート                        <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="importFromCSV(this)">                    </label>                </div>            </div>            <div class="modal-footer">                <button type="button" class="btn btn-cancel" onclick="toggleSettingsModal()">閉じる</button>            </div>        </div>    </div>    <!-- 予定追加・編集モーダル（PC・スマホ共通 全画面化） -->    <div id="calendarModalOverlay" class="modal-overlay" style="display:none;">        <div class="calendar-modal">            <!-- 通常入力ビュー -->            <div id="scheduleFormView">                <div class="modal-header">                    <h3 class="modal-title">新しい予定を追加</h3>                    <button type="button" id="closeModalBtn" class="close-btn">×</button>                </div>                <form id="scheduleForm">                    <div class="form-group">                        <label for="scheduleTitle">タイトル</label>                        <div class="title-with-stamp">                            <button type="button" id="stampTriggerBtn" class="stamp-trigger-btn" onclick="openIconPickerView()" title="スタンプを選択">                                スタンプ                            </button>                            <input type="text" id="scheduleTitle" class="form-control" placeholder="予定のタイトルを入力" required>                        </div>                    </div>                    <div class="form-group">                        <div class="checkbox-group">                            <input type="checkbox" id="allDayCheckbox">                            <label for="allDayCheckbox">終日</label>                        </div>                    </div>                    <div class="form-group">                        <label>日時</label>                        <div class="time-range">                            <input type="datetime-local" id="startTime" class="form-control" required>                            <span>～</span>                            <input type="datetime-local" id="endTime" class="form-control">                        </div>                    </div>                    <div class="form-group">                        <label for="scheduleLocation">場所</label>                        <input type="text" id="scheduleLocation" class="form-control" placeholder="場所を追加">                    </div>                    <div class="form-group">                        <label for="scheduleDescription">説明</label>                        <textarea id="scheduleDescription" class="form-control" rows="3" placeholder="メモや詳細を入力"></textarea>                    </div>                    <div class="modal-footer">                        <button type="button" id="cancelModalBtn" class="btn btn-cancel">キャンセル</button>                        <button type="submit" class="btn btn-submit">保存</button>                    </div>                </form>            </div>            <!-- スタンプ（アイコン）選択専用画面ビュー -->            <div id="iconPickerView" style="display:none;">                <div class="modal-header">                    <h3 class="modal-title">スタンプを選択</h3>                    <button type="button" class="close-btn" onclick="cancelIconSelection()">×</button>                </div>                <div id="iconPickerGrid" class="icon-picker-grid"></div>                <!-- ページネーション（アイコンが多い場合に表示） -->                <div id="iconPagination" class="icon-pagination" style="display:none;">                    <button type="button" class="btn page-nav-btn" onclick="changeIconPage(-1)">&lt;</button>                    <span id="iconPageIndicator" class="page-indicator">(1/1)</span>                    <button type="button" class="btn page-nav-btn" onclick="changeIconPage(1)">&gt;</button>                </div>                <div class="modal-footer">                    <button type="button" class="btn btn-cancel" onclick="cancelIconSelection()">キャンセル</button>                    <button type="button" class="btn btn-submit" onclick="confirmIconSelection()">OK</button>                </div>            </div>        </div>    </div>    <script src="image/icons.js"></script>    <script src="script.js"></script></body></html>
