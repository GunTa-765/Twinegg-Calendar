<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Twinegg カレンダー</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="container">
    <!-- カレンダーエリア -->

	<!-- Yahooカレンダー風 年月ジャンプポップアップ -->
	<div id="ym-picker" class="ym-picker-box" style="display: none;">
	        <div class="ym-picker-header">
	            <button type="button" class="btn" onclick="changePickerYear(-1)">◀</button>
	            <span id="picker-year-title" class="picker-year-text">2026年</span>
	            <button type="button" class="btn" onclick="changePickerYear(1)">▶</button>
	        </div>
	        <div class="ym-picker-months">
	            <!-- 1月〜12月のボタンをループの代わりに直書き -->
	            <button type="button" class="month-btn" onclick="selectPickerMonth(1)">1月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(2)">2月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(3)">3月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(4)">4月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(5)">5月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(6)">6月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(7)">7月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(8)">8月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(9)">9月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(10)">10月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(11)">11月</button>
	            <button type="button" class="month-btn" onclick="selectPickerMonth(12)">12月</button>
	        </div>
	        <div class="ym-picker-footer">
	            <button type="button" class="btn" onclick="toggleYearMonthPicker()">キャンセル</button>
	        </div>
	</div>

	    <div class="calendar-box">
	        <div class="header">
	            <div class="header-left"></div>
	            <div class="header-center">
	                <button class="btn" onclick="changeMonth(-1)">◀</button>
	                <!-- クリックで年月選択画面を開くイベントを追加 -->
	                <h2 id="calendar-title" class="calendar-title" onclick="toggleYearMonthPicker()" style="cursor: pointer; user-select: none;"></h2>
	                <button class="btn" onclick="changeMonth(1)">▶</button>



	            </div>
	            <div class="header-right">
	                <button class="btn btn-today" onclick="goToday()">今日</button>
                <!-- ★スマホ用：右上のギア（設定）ボタンを追加 -->
	                <button class="btn btn-settings-toggle" onclick="toggleMobileSettings()">⚙️</button>
	            </div>
	        </div>
	        <div class="days-grid">
	            <div class="text-sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-sat">土</div>
	        </div>
	        <div class="weeks-grid" id="calendar-days"></div>
	    </div>

    <!-- 右側の予定ペイン（PCでは右側、スマホでは下に配置されます） -->
	    <div class="side-box">
	        <div class="mobile-plan-section">
	            <h3 id="side-title" class="side-title"></h3>
	            <div id="plan-list"></div>
	        </div>
        
        <!-- PC用の入力エリア（スマホでは非表示にします） -->
	        <div class="pc-input-area">
	            <input type="text" id="plan-input" class="input-text" placeholder="予定を入力">
	            <button id="openModalBtn" class="btn-add">＋ 予定を追加</button>
	            <button class="btn-export" onclick="exportToCSV()" style="margin-top: 10px;">CSVでエクスポート</button>
	            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd;">
	                <label for="csv-file-input" style="font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">CSVからインポート</label>
	                <input type="file" id="csv-file-input" accept=".csv" style="font-size: 12px; width: 100%;" onchange="importFromCSV(this)">
	            </div>
	        </div>
	    </div>
	</div>

<!-- ★スマホ用：画面右下の「＋」ボタン -->
	<button class="mobile-fab" onclick="openMobileAddModal()">＋</button>

<!-- ★スマホ用：予定追加モーダル（ポップアップ） -->
	<div id="mobile-add-modal" class="mobile-modal" style="display: none;">
	    <div class="mobile-modal-content">
	        <h3>新しい予定を追加</h3>
	        <input type="text" id="mobile-plan-input" class="input-text" placeholder="予定を入力してください">
	        <div class="mobile-modal-actions">
	            <button class="btn" onclick="closeMobileAddModal()">キャンセル</button>
	            <button class="btn-add" onclick="addPlanMobile()" style="width: auto; padding: 6px 15px;">追加</button>
	        </div>
	    </div>
	</div>

<!-- ★スマホ用：設定モーダル（CSVインポート/エクスポート用） -->
	<div id="mobile-settings-modal" class="mobile-modal" style="display: none;">
	    <div class="mobile-modal-content">
	        <h3>カレンダー設定</h3>
	        <button class="btn-export" onclick="exportToCSV()" style="margin-bottom: 15px;">CSVでエクスポート</button>
	        <div style="padding-top: 15px; border-top: 1px dashed #ddd; margin-bottom: 15px;">
	            <label for="mobile-csv-file-input" style="font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">CSVからインポート</label>
	            <input type="file" id="mobile-csv-file-input" accept=".csv" style="font-size: 12px; width: 100%;" onchange="importFromCSV(this); toggleMobileSettings();">
	        </div>
	        <button class="btn" style="width: 100%;" onclick="toggleMobileSettings()">閉じる</button>
	    </div>
	</div>

	<script src="script.js"></script>
<!-- Yahooカレンダー風 予定編集モーダル -->
<div id="calendarModalOverlay" class="modal-overlay" style="display: none;">
    <div class="calendar-modal">
        <div class="modal-header">
            <h3 class="modal-title">予定の編集</h3>
            <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        
        <form id="scheduleForm">
            <!-- タイトル -->
            <div class="form-group">
                <label for="scheduleTitle">タイトル</label>
                <input type="text" id="scheduleTitle" class="form-control" placeholder="予定のタイトルを入力" required>
            </div>

            <!-- 日時 -->
            <div class="form-group">
                <label>日時</label>
                <div class="time-range">
                    <input type="datetime-local" id="startTime" class="form-control" required>
                    <span>～</span>
                    <input type="datetime-local" id="endTime" class="form-control" required>
                </div>
            </div>

            <!-- 終日チェックボックス -->
            <div class="form-group checkbox-group">
                <input type="checkbox" id="allDayCheckbox">
                <label for="allDayCheckbox" style="margin:0; font-weight:normal; cursor:pointer;">終日</label>
            </div>

            <!-- 場所 -->
            <div class="form-group">
                <label for="scheduleLocation">場所</label>
                <input type="text" id="scheduleLocation" class="form-control" placeholder="場所を入力">
            </div>

            <!-- 説明/メモ -->
            <div class="form-group">
                <label for="scheduleDescription">説明</label>
                <textarea id="scheduleDescription" class="form-control" rows="3" placeholder="詳細を入力"></textarea>
            </div>

            <!-- アクションボタン -->
            <div class="modal-footer">
                <button type="button" id="cancelModalBtn" class="btn btn-cancel">キャンセル</button>
                <button type="submit" class="btn btn-submit">保存</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
