<!DOCTYPE html><html lang="ja"><head>    <meta charset="UTF-8">    <title>Twinegg カレンダー</title>    <link rel="stylesheet" href="style.css"></head><body>	<div class="container">    <!-- カレンダーエリア -->	    <div class="calendar-box">	        <div class="header">	            <div class="header-left"></div>	            <div class="header-center">	                <button class="btn" onclick="changeMonth(-1)">◀</button>	                <h2 id="calendar-title" class="calendar-title" onclick="toggleYearMonthPicker()" style="cursor: pointer;"></h2>	                <button class="btn" onclick="changeMonth(1)">▶</button>	            </div>	            <div class="header-right">	                <button class="btn btn-today" onclick="goToday()">今日</button>                <!-- ★スマホ用：右上のギア（設定）ボタンを追加 -->	                <button class="btn btn-settings-toggle" onclick="toggleMobileSettings()">⚙️</button>	            </div>	        </div>	        <div class="days-grid">	            <div class="text-sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-sat">土</div>	        </div>	        <div class="weeks-grid" id="calendar-days"></div>	    </div>    <!-- 右側の予定ペイン（PCでは右側、スマホでは下に配置されます） -->	    <div class="side-box">	        <div class="mobile-plan-section">	            <h3 id="side-title" class="side-title"></h3>	            <div id="plan-list"></div>	        </div>                <!-- PC用の入力エリア（スマホでは非表示にします） -->	        <div class="pc-input-area">	            <input type="text" id="plan-input" class="input-text" placeholder="予定を入力">	            <button class="btn-add" onclick="addPlan()">予定を追加</button>	            <button class="btn-export" onclick="exportToCSV()" style="margin-top: 10px;">CSVでエクスポート</button>	            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd;">	                <label for="csv-file-input" style="font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">CSVからインポート</label>	                <input type="file" id="csv-file-input" accept=".csv" style="font-size: 12px; width: 100%;" onchange="importFromCSV(this)">	            </div>	        </div>	    </div>	</div><!-- ★スマホ用：画面右下の「＋」ボタン -->	<button class="mobile-fab" onclick="openMobileAddModal()">＋</button><!-- ★スマホ用：予定追加モーダル（ポップアップ） -->	<div id="mobile-add-modal" class="mobile-modal" style="display: none;">	    <div class="mobile-modal-content">	        <h3>新しい予定を追加</h3>	        <input type="text" id="mobile-plan-input" class="input-text" placeholder="予定を入力してください">	        <div class="mobile-modal-actions">	            <button class="btn" onclick="closeMobileAddModal()">キャンセル</button>	            <button class="btn-add" onclick="addPlanMobile()" style="width: auto; padding: 6px 15px;">追加</button>	        </div>	    </div>	</div><!-- ★スマホ用：設定モーダル（CSVインポート/エクスポート用） -->	<div id="mobile-settings-modal" class="mobile-modal" style="display: none;">	    <div class="mobile-modal-content">	        <h3>カレンダー設定</h3>	        <button class="btn-export" onclick="exportToCSV()" style="margin-bottom: 15px;">CSVでエクスポート</button>	        <div style="padding-top: 15px; border-top: 1px dashed #ddd; margin-bottom: 15px;">	            <label for="mobile-csv-file-input" style="font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">CSVからインポート</label>	            <input type="file" id="mobile-csv-file-input" accept=".csv" style="font-size: 12px; width: 100%;" onchange="importFromCSV(this); toggleMobileSettings();">	        </div>	        <button class="btn" style="width: 100%;" onclick="toggleMobileSettings()">閉じる</button>	    </div>	</div>	<script src="script.js"></script></body></html>
